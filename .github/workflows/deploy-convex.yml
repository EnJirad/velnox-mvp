name: Deploy Convex Production

on:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "package.json"
      - "bun.lock"
      - "convex.json"
      - ".github/workflows/deploy-convex.yml"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Convex
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Convex CLI
        run: npm install -g convex

      - name: Deploy Convex Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: convex deploy
